<svg xmlns="http://www.w3.org/2000/svg" width="240" height="88" viewBox="0 0 240 88" role="img" aria-labelledby="title desc"><title id="title">Instagram — @mrtojiboev</title><desc id="desc">Animated Instagram profile card. Follow the enclosing link to open the account.</desc><defs><linearGradient id="brand" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ffcc55"/><stop offset=".45" stop-color="#f43f70"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><style>.icon{transform-origin:38px 44px;animation:float 3.6s ease-in-out infinite;animation-delay:-0.0s}.halo{animation:glow 3.6s ease-in-out infinite;animation-delay:-0.0s}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes glow{0%,100%{opacity:.25}50%{opacity:.8}}@media(prefers-reduced-motion:reduce){.icon,.halo{animation:none}}</style><rect x="2" y="7" width="236" height="74" rx="18" fill="#111c2e" stroke="#2d405b"/><rect class="halo" x="3" y="8" width="234" height="72" rx="17" fill="none" stroke="#fb7185"/><g class="icon"><rect x="16" y="22" width="44" height="44" rx="13" fill="url(#brand)"/><g transform="translate(24 30)"><rect x="1" y="1" width="26" height="26" rx="8" fill="none" stroke="white" stroke-width="2.3"/><circle cx="14" cy="14" r="6" fill="none" stroke="white" stroke-width="2.3"/><circle cx="22" cy="6" r="1.6" fill="white"/></g></g><text x="74" y="39" fill="#f1f5f9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700">Instagram</text><text x="74" y="58" fill="#fb7185" font-family="Arial,Helvetica,sans-serif" font-size="12">@mrtojiboev</text><circle cx="220" cy="26" r="3" fill="#fb7185"/></svg>
