<svg xmlns="http://www.w3.org/2000/svg" width="240" height="88" viewBox="0 0 240 88" role="img" aria-labelledby="title desc"><title id="title">LinkedIn — Olimjon Tojiboev</title><desc id="desc">Animated LinkedIn profile card. Follow the enclosing link to open the account.</desc><defs><linearGradient id="brand" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#0a66c2"/></linearGradient></defs><style>.icon{transform-origin:38px 44px;animation:float 3.6s ease-in-out infinite;animation-delay:-1.6s}.halo{animation:glow 3.6s ease-in-out infinite;animation-delay:-1.6s}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes glow{0%,100%{opacity:.25}50%{opacity:.8}}@media(prefers-reduced-motion:reduce){.icon,.halo{animation:none}}</style><rect x="2" y="7" width="236" height="74" rx="18" fill="#111c2e" stroke="#2d405b"/><rect class="halo" x="3" y="8" width="234" height="72" rx="17" fill="none" stroke="#22d3ee"/><g class="icon"><rect x="16" y="22" width="44" height="44" rx="13" fill="url(#brand)"/><g transform="translate(24 30)"><circle cx="4" cy="5" r="2.5" fill="white"/><path d="M2 10h4v16H2Zm8 0h4v2c1-1.5 2.5-2.4 4.5-2.4 4 0 5.5 2.6 5.5 6.6V26h-4v-9c0-2.3-.8-3.8-2.8-3.8S14 14.8 14 17v9h-4Z" fill="white"/></g></g><text x="74" y="39" fill="#f1f5f9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700">LinkedIn</text><text x="74" y="58" fill="#22d3ee" font-family="Arial,Helvetica,sans-serif" font-size="12">Olimjon Tojiboev</text><circle cx="220" cy="26" r="3" fill="#22d3ee"/></svg>
