<svg xmlns="http://www.w3.org/2000/svg" width="760" height="170" viewBox="0 0 760 170" role="img" aria-label="Idea, plan, build, test and improve"><style>text{font-family:Arial,sans-serif}.flow{stroke-dasharray:30 650;animation:f 12s linear infinite}@keyframes f{to{stroke-dashoffset:-680}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style><defs><linearGradient id="g"><stop stop-color="#00d9ff"/><stop offset=".5" stop-color="#f85d7f"/><stop offset="1" stop-color="#f8d866"/></linearGradient></defs><rect x="1" y="1" width="758" height="168" rx="16" fill="#141321" stroke="#302840"/><path d="M80 75h600" stroke="#393249" stroke-width="3"/><path class="flow" d="M80 75h600" stroke="url(#g)" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="80" cy="75" r="23" fill="#1c1a2e" stroke="#00d9ff" stroke-width="2"/><text x="80" y="81" text-anchor="middle" font-size="18" fill="#00d9ff">1</text><text x="80" y="125" text-anchor="middle" font-size="13" fill="#d7d3e8">IDEA</text><circle cx="230" cy="75" r="23" fill="#1c1a2e" stroke="#a78bfa" stroke-width="2"/><text x="230" y="81" text-anchor="middle" font-size="18" fill="#a78bfa">2</text><text x="230" y="125" text-anchor="middle" font-size="13" fill="#d7d3e8">PLAN</text><circle cx="380" cy="75" r="23" fill="#1c1a2e" stroke="#f85d7f" stroke-width="2"/><text x="380" y="81" text-anchor="middle" font-size="18" fill="#f85d7f">3</text><text x="380" y="125" text-anchor="middle" font-size="13" fill="#d7d3e8">BUILD</text><circle cx="530" cy="75" r="23" fill="#1c1a2e" stroke="#f8d866" stroke-width="2"/><text x="530" y="81" text-anchor="middle" font-size="18" fill="#f8d866">4</text><text x="530" y="125" text-anchor="middle" font-size="13" fill="#d7d3e8">TEST</text><circle cx="680" cy="75" r="23" fill="#1c1a2e" stroke="#34d399" stroke-width="2"/><text x="680" y="81" text-anchor="middle" font-size="18" fill="#34d399">5</text><text x="680" y="125" text-anchor="middle" font-size="13" fill="#d7d3e8">IMPROVE</text></svg>
